<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Terraform Catalogue API request flow</title>
  <desc id="desc">AWS-style architecture diagram showing a client request flowing through API Gateway, Lambda, DynamoDB, and CloudWatch Logs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#232f3e" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ff9900" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .aws-boundary { fill: #f7f8fa; stroke: #232f3e; stroke-width: 3; }
      .lane { fill: #ffffff; stroke: #d5dbdb; stroke-width: 2; }
      .title { fill: #232f3e; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #5f6b7a; font: 400 17px Arial, sans-serif; }
      .label { fill: #16191f; font: 700 19px Arial, sans-serif; }
      .small { fill: #5f6b7a; font: 400 15px Arial, sans-serif; }
      .note { fill: #394452; font: 400 16px Arial, sans-serif; }
      .aws-orange { fill: #ff9900; }
      .aws-dark { fill: #232f3e; }
      .aws-blue { fill: #1f77b4; }
      .aws-purple { fill: #7d3c98; }
      .aws-green { fill: #3f8624; }
      .icon-box { rx: 8; stroke: #232f3e; stroke-width: 2; }
      .service-card { fill: #ffffff; stroke: #b8c4cf; stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #232f3e; stroke-width: 4; marker-end: url(#arrow); }
      .return-flow { fill: none; stroke: #5f6b7a; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .permission-flow { fill: none; stroke: #ff9900; stroke-width: 3; stroke-dasharray: 7 7; marker-end: url(#arrow-orange); }
      .step { fill: #232f3e; font: 700 14px Arial, sans-serif; }
      .step-circle { fill: #ffffff; stroke: #232f3e; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" />

  <text x="700" y="58" text-anchor="middle" class="title">Terraform Catalogue API - Request Flow</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Project 2 serverless architecture: API Gateway, Lambda, DynamoDB, IAM, and CloudWatch</text>

  <rect x="265" y="130" width="990" height="600" class="aws-boundary" />
  <text x="300" y="170" class="label">AWS Cloud</text>
  <text x="300" y="196" class="small">Serverless API boundary</text>

  <rect x="310" y="230" width="900" height="230" class="lane" />
  <text x="335" y="263" class="small">Request path</text>

  <rect x="310" y="500" width="900" height="170" class="lane" />
  <text x="335" y="533" class="small">Observability and permissions</text>

  <!-- Client -->
  <rect x="60" y="300" width="150" height="120" class="service-card" />
  <circle cx="135" cy="342" r="25" fill="#ffffff" stroke="#232f3e" stroke-width="4" />
  <path d="M105 385 C115 362,155 362,165 385" fill="none" stroke="#232f3e" stroke-width="4" />
  <text x="135" y="438" text-anchor="middle" class="label">Client</text>
  <text x="135" y="462" text-anchor="middle" class="small">Browser, curl, app</text>

  <!-- API Gateway -->
  <rect x="360" y="285" width="170" height="130" class="service-card" />
  <rect x="407" y="308" width="76" height="62" class="icon-box aws-purple" />
  <path d="M423 339 H467 M445 318 V360" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <circle cx="423" cy="339" r="7" fill="#ffffff" />
  <circle cx="467" cy="339" r="7" fill="#ffffff" />
  <circle cx="445" cy="318" r="7" fill="#ffffff" />
  <circle cx="445" cy="360" r="7" fill="#ffffff" />
  <text x="445" y="438" text-anchor="middle" class="label">API Gateway</text>
  <text x="445" y="462" text-anchor="middle" class="small">HTTP API routes</text>

  <!-- Lambda -->
  <rect x="630" y="285" width="170" height="130" class="service-card" />
  <rect x="677" y="308" width="76" height="62" class="icon-box aws-orange" />
  <path d="M701 356 L715 318 L729 356" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  <path d="M729 356 H742" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <text x="715" y="438" text-anchor="middle" class="label">Lambda</text>
  <text x="715" y="462" text-anchor="middle" class="small">Python handler</text>

  <!-- DynamoDB -->
  <rect x="900" y="285" width="170" height="130" class="service-card" />
  <rect x="947" y="308" width="76" height="62" class="icon-box aws-blue" />
  <ellipse cx="985" cy="320" rx="26" ry="9" fill="none" stroke="#ffffff" stroke-width="4" />
  <path d="M959 320 V355 C959 360,1011 360,1011 355 V320" fill="none" stroke="#ffffff" stroke-width="4" />
  <path d="M959 337 C959 342,1011 342,1011 337" fill="none" stroke="#ffffff" stroke-width="4" />
  <path d="M959 352 C959 357,1011 357,1011 352" fill="none" stroke="#ffffff" stroke-width="4" />
  <text x="985" y="438" text-anchor="middle" class="label">DynamoDB</text>
  <text x="985" y="462" text-anchor="middle" class="small">Module metadata</text>

  <!-- CloudWatch -->
  <rect x="500" y="565" width="170" height="90" class="service-card" />
  <rect x="525" y="586" width="52" height="44" class="icon-box aws-dark" />
  <polyline points="536,618 546,606 557,612 567,596" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="612" y="604" class="label">CloudWatch</text>
  <text x="612" y="630" class="small">Lambda logs</text>

  <!-- IAM -->
  <rect x="785" y="565" width="215" height="90" class="service-card" />
  <rect x="810" y="586" width="52" height="44" class="icon-box aws-green" />
  <path d="M836 594 L856 604 V620 C856 627,846 632,836 635 C826 632,816 627,816 620 V604 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  <text x="878" y="604" class="label">IAM</text>
  <text x="878" y="630" class="small">Execution role and policies</text>

  <!-- Main flow arrows -->
  <line x1="210" y1="360" x2="360" y2="360" class="flow" />
  <line x1="530" y1="360" x2="630" y2="360" class="flow" />
  <line x1="800" y1="360" x2="900" y2="360" class="flow" />

  <!-- Return flow -->
  <path d="M900 392 C790 487,560 487,445 392" class="return-flow" />
  <path d="M360 392 C295 453,240 453,190 405" class="return-flow" />

  <!-- Logs and permissions -->
  <line x1="690" y1="415" x2="620" y2="565" class="flow" />
  <path d="M885 565 C845 500,780 455,730 415" class="permission-flow" />
  <path d="M900 565 C935 500,965 455,985 415" class="permission-flow" />

  <!-- Step circles -->
  <circle cx="285" cy="338" r="17" class="step-circle" />
  <text x="285" y="343" text-anchor="middle" class="step">1</text>
  <circle cx="580" cy="338" r="17" class="step-circle" />
  <text x="580" y="343" text-anchor="middle" class="step">2</text>
  <circle cx="850" cy="338" r="17" class="step-circle" />
  <text x="850" y="343" text-anchor="middle" class="step">3</text>
  <circle cx="735" cy="486" r="17" class="step-circle" />
  <text x="735" y="491" text-anchor="middle" class="step">4</text>
  <circle cx="250" cy="438" r="17" class="step-circle" />
  <text x="250" y="443" text-anchor="middle" class="step">5</text>

  <!-- Step labels -->
  <text x="280" y="315" text-anchor="middle" class="small">HTTPS request</text>
  <text x="580" y="315" text-anchor="middle" class="small">Invoke function</text>
  <text x="850" y="315" text-anchor="middle" class="small">Read item(s)</text>
  <text x="735" y="514" text-anchor="middle" class="small">JSON response</text>
  <text x="250" y="466" text-anchor="middle" class="small">Return to client</text>

  <!-- Notes -->
  <rect x="80" y="605" width="310" height="95" fill="#fff7e6" stroke="#ff9900" stroke-width="2" rx="10" />
  <text x="105" y="636" class="label">Design posture</text>
  <text x="105" y="663" class="note">Public read-only API first.</text>
  <text x="105" y="687" class="note">Write endpoints require auth later.</text>

  <rect x="1075" y="565" width="150" height="90" class="service-card" />
  <text x="1150" y="604" text-anchor="middle" class="label">Terraform</text>
  <text x="1150" y="630" text-anchor="middle" class="small">provisions all</text>
</svg>
